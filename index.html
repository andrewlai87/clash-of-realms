<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clash of Realms — Fantasy Chess</title>
  <meta name="theme-color" content="#17131f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clash of Realms">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/icons/icon-192.png">
</head>
<body>

  <header>
    <h1>⚔ Clash of Realms</h1>
    <p class="tagline">The Ivory Order &nbsp;·&nbsp; a fantasy chess saga &nbsp;·&nbsp; The Obsidian Legion</p>
  </header>

  <main>
    <div id="board3d-wrap">
      <div id="board3d"></div>
      <div id="battle3d-banner" hidden></div>
      <div id="orbit-hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; click a piece to command it</div>
    </div>

    <aside id="panel">
      <section class="panel-box" id="status-panel">
        <div id="turn-banner"></div>
        <div id="status-msg"></div>
      </section>

      <section class="panel-box">
        <h3>Command</h3>
        <div class="ctl-row">
          <label for="mode-select">Foe</label>
          <select id="mode-select">
            <option value="ai" selected>The Computer</option>
            <option value="2p">A Friend (2P)</option>
          </select>
        </div>
        <div id="ai-options">
          <div class="ctl-row">
            <label for="level-select">Cunning</label>
            <select id="level-select">
              <option value="squire">Squire (novice)</option>
              <option value="manatarms">Man-at-Arms (easy)</option>
              <option value="knight" selected>Knight (medium)</option>
              <option value="champion">Champion (hard)</option>
              <option value="warlord">Warlord (expert)</option>
              <option value="archmage">Archmage (master)</option>
            </select>
          </div>
          <div class="ctl-row">
            <label for="color-select">You lead</label>
            <select id="color-select">
              <option value="w" selected>The Ivory Order</option>
              <option value="b">The Obsidian Legion</option>
            </select>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn" id="btn-new">⚔ New Campaign</button>
          <button class="btn btn-ghost" id="btn-undo">↩ Undo</button>
          <button class="btn btn-ghost" id="btn-flip">⇅ Flip</button>
        </div>
        <div class="toggle-row">
          <label><input type="checkbox" id="toggle-battles" checked> Battle scenes</label>
          <label><input type="checkbox" id="toggle-sound" checked> Sound</label>
        </div>
      </section>

      <section class="panel-box">
        <h3>The Fallen</h3>
        <div class="captured-label">Ivory Order</div>
        <div class="captured-row" id="captured-w"></div>
        <div class="captured-label">Obsidian Legion</div>
        <div class="captured-row" id="captured-b"></div>
      </section>
    </aside>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ai.js"></script>
  <script src="js3d/vendor/three.min.js"></script>
  <script src="js3d/vendor/GLTFLoader.js"></script>
  <script src="js3d/vendor/SkeletonUtils.js"></script>
  <script src="js3d/tween3d.js"></script>
  <script src="js3d/pieces3d.js"></script>
  <script src="js3d/board3d.js"></script>
  <script src="js3d/battle3d.js"></script>
  <script src="js3d/app3d.js"></script>
  <script>
    // Offline support — only registers on secure origins (https / localhost).
    if ("serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    // Touch devices get touch wording in the hint.
    if (window.matchMedia && matchMedia("(pointer: coarse)").matches) {
      document.getElementById("orbit-hint").innerHTML =
        "drag to orbit &nbsp;·&nbsp; pinch to zoom &nbsp;·&nbsp; tap a piece to command it";
    }
  </script>
</body>
</html>
